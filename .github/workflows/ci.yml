name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build (iOS)
        # The whole-package scheme must compile for every declared platform, or
        # Swift Package Index's compatibility build fails at analysis. Catches a
        # macOS-only API leaking into a shared or example target.
        run: xcodebuild -scheme ShotKit-Package -destination 'generic/platform=iOS' -skipMacroValidation -skipPackagePluginValidation build
